# DramaX E2E：SIWE 认证 + 全业务链路（GitHub Actions runner 直连 workers.dev，无墙）
# 手动触发：gh workflow run e2e.yml（或 API workflow_dispatch）
name: dramax-e2e

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *" # 每 2 小时（避开整点高峰；GHA 调度常有延迟）

permissions: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps (viem)
        working-directory: 10_工程代码/scripts
        run: npm i --no-save viem@^2

      - name: Trigger cron first (release expired matches before assertions)
        run: |
          curl -sS -m 30 -X POST https://dramax-api-testnet.dappweb.workers.dev/internal/cron \
            -H "x-internal-token: ${{ secrets.DRAMAX_CRON_TOKEN }}" || true
          sleep 3

      - name: SIWE auth E2E
        working-directory: 10_工程代码/scripts
        run: node siwe-e2e.mjs

      - name: Business E2E
        working-directory: 10_工程代码/scripts
        env:
          E2E_ADMIN_PASS: ${{ secrets.DRAMAX_E2E_ADMIN_PASS }}
        run: node business-e2e.mjs

  prod-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production API health (chain 56)
        run: |
          body=$(curl -sS -m 30 https://dramax-api.dappweb.workers.dev/health)
          echo "$body"
          echo "$body" | grep -q '"chain": *56\|"chain":56'
          echo "chain=56 OK"

      - name: Verify production frontends
        run: |
          code_m=$(curl -sS -m 30 -o /tmp/mobile.html -w "%{http_code}" https://dramax-mobile.pages.dev/)
          grep -q "DramaX" /tmp/mobile.html
          echo "mobile: $code_m + DramaX OK"
          code_a=$(curl -sS -m 30 -o /tmp/admin.html -w "%{http_code}" https://dramax-admin.pages.dev/)
          grep -q "DramaX" /tmp/admin.html
          echo "admin: $code_a + DramaX OK"
